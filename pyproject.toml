[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-smartcity-lab"
version = "0.1.0"
description = "Post-quantum (ML-KEM/ML-DSA) and classical cryptography lab for smart-city MQTT telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Lukasz Paluch" }]
keywords = ["post-quantum", "ml-kem", "ml-dsa", "mqtt", "smart-city", "benchmark"]
dependencies = [
  "cryptography>=44",
  "liboqs-python==0.16.0.1",
  "paho-mqtt>=2.1,<3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pqc-smartcity = "pqc_smartcity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
